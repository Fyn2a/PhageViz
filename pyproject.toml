[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phageviz"
version = "0.1.0"
description = "Interactive bacteriophage genome annotation viewer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "numpy>=1.26",
    "biopython>=1.83",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: live calls to NCBI (opt-in with -m network)"]
